name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run build

  contracts:
    name: Contracts (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # soroban-sdk 26 refuses to build for wasm32-unknown-unknown on
          # Rust 1.82+ (reference-types/multi-value are on by default there,
          # which it doesn't yet support) — it requires wasm32v1-none instead.
          targets: wasm32v1-none
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      # Not yet verified against this codebase (no Rust toolchain was available
      # to check formatting/lints before this workflow was added) — kept
      # non-blocking until a first green run confirms they pass, then should
      # be made blocking like the steps below.
      - run: cargo fmt --check
        continue-on-error: true
      - run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - run: cargo test
      - run: cargo build --target wasm32v1-none --release
